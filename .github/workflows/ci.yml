name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: |
          if [ -d Tests ]; then
            swift test
          else
            echo "No Tests/ directory — skipping (add test targets to enable)."
          fi

      - name: Package .app bundle (sanity)
        run: ./build-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandPassFilterController-app
          path: dist/Band Pass Filter Controller.app
          if-no-files-found: error
