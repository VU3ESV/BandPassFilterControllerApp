name: Release

# Every pull request merged into main cuts a new MINOR version release:
# the latest vX.Y.Z tag is bumped to vX.(Y+1).0, a GitHub Release is created
# with auto-generated notes, and the built macOS .app is attached.
#
# Note: for `pull_request` events GitHub uses the workflow file from the PR's
# head, so even the PR that first added this file triggered a release. To make a
# change WITHOUT cutting a release, push it straight to main — the Release job
# only runs on pull_request merges (direct pushes run CI only).
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write  # create tags / releases and upload assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: bump minor + publish
    if: github.event.pull_request.merged == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main          # tag/build the post-merge state of main
          fetch-depth: 0      # full history + tags for version diffing

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          LATEST="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)"
          if [ -z "$LATEST" ]; then
            NEXT="v0.1.0"
          else
            ver="${LATEST#v}"
            MAJOR="${ver%%.*}"
            rest="${ver#*.}"
            MINOR="${rest%%.*}"
            NEXT="v${MAJOR}.$((MINOR + 1)).0"
          fi
          echo "Previous: ${LATEST:-none}  ->  Next: $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "prev=${LATEST:-none}" >> "$GITHUB_OUTPUT"

      - name: Guard against existing tag
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ steps.version.outputs.next }} already exists"
            exit 1
          fi

      - name: Stamp app version
        run: |
          set -euo pipefail
          V="${NEXT#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" Resources/Info.plist
        env:
          NEXT: ${{ steps.version.outputs.next }}

      - name: Build signed + notarized DMG (app with embedded extension)
        env:
          VERSION: ${{ steps.version.outputs.next }}
          # Signing/notarization secrets (see docs/SIGNING-SECRETS.md). When unset, the script
          # falls back to ad-hoc and skips notarization — the build still succeeds, but the
          # released app's extension will not register on other Macs.
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/package-signed.sh        # -> dist/BandPassFilterController-<NEXT>-macos.dmg

      - name: Build plugin package (.appex / .radioplugin)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/make-radioplugin.sh        # -> dist/BPF.radioplugin (leaves the .app intact)

      - name: Package release assets
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Publish the app as a .dmg; the plugin is an ADDITIONAL artifact alongside it.
          cp "dist/BandPassFilterController-${NEXT}-macos.dmg" dist-release/
          cp dist/BPF.radioplugin "dist-release/BandPassFilterController-${NEXT}.radioplugin"
          ( cd dist-release && shasum -a 256 ./*.dmg ./*.radioplugin > SHA256SUMS )
          ls -la dist-release
        env:
          NEXT: ${{ steps.version.outputs.next }}

      - name: Compose release notes
        env:
          NEXT: ${{ steps.version.outputs.next }}
          # 'true' only when the signing + notary secrets are present — i.e. the build was
          # Developer-ID signed and Apple-notarized. Otherwise it's an ad-hoc build.
          NOTARIZED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.NOTARY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          # NB: written to the repo root, NOT dist-release/, so it isn't uploaded as an asset.
          {
            echo "## Band Pass Filter Controller ${NEXT}"
            echo
            echo "macOS controller app + Amateur Radio Suite plugin (\`BandPassFilterController-${NEXT}.radioplugin\`)."
            echo
            echo "### Install"
            echo
            echo "1. Download \`BandPassFilterController-${NEXT}-macos.dmg\` below."
            echo "2. Open the DMG and drag **Band Pass Filter Controller.app** to \`/Applications\`."
            if [ "${NOTARIZED}" = "true" ]; then
              echo "3. Launch it — signed with Developer ID and **Apple-notarized**, so no Gatekeeper bypass is needed."
            else
              echo "3. **One-time Gatekeeper bypass** (this build is ad-hoc-signed, not Apple-notarized):"
              echo "   \`\`\`sh"
              echo "   xattr -dr com.apple.quarantine \"/Applications/Band Pass Filter Controller.app\""
              echo "   \`\`\`"
              echo "4. Launch normally."
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "$NEXT" \
            --target main \
            --title "$NEXT" \
            --generate-notes \
            --notes-file RELEASE_NOTES.md \
            dist-release/*
